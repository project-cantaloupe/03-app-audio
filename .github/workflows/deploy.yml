name: Build and Push Docker Image to Harbor

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. 소스코드 가져오기
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Tailscale VPN 연결
    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    # 3. Docker Buildx 설정 (Insecure / HTTP 통신 허용)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-config-inline: |
          [registry."100.69.73.122:30080"]
            http = true
            insecure = true

    # 4. Harbor 로그인 (HTTP 프로토콜 명시)
    - name: Log in to Harbor
      uses: docker/login-action@v3
      with:
        registry: http://100.69.73.122:30080
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    # 5. Docker 이미지 빌드 & Push
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          100.69.73.122:30080/library/app-audio:latest
          100.69.73.122:30080/library/app-audio:${{ github.sha }}
