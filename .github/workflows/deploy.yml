name: CI/CD Pipeline for app-audio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  HARBOR_REGISTRY: cntlp-onp-wk-01.tail270b85.ts.net:31432
  HARBOR_PROJECT: library

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 소스코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Tailscale VPN 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          hostname: github-runner-${{ github.run_id }}

      # 3. Docker Daemon Insecure 설정, 네트워크 대기 및 CLI 로그인
      - name: Configure Docker & Log in to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # 1) Insecure Registry 설정
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries": ["'${{ env.HARBOR_REGISTRY }}'"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          
          # 2) Tailscale 네트워크 가용성 확인 (최대 30초 대기)
          echo "Waiting for Tailscale network routing to Harbor..."
          for i in {1..10}; do
            if curl -s --connect-timeout 2 http://${{ env.HARBOR_REGISTRY }}/v2/ > /dev/null 2>&1; then
              echo "Harbor network is ready!"
              break
            fi
            echo "Retrying Harbor connection ($i/10)..."
            sleep 3
          done
          
          # 3) CLI 로그인 (printf 사용으로 개행문자 제거 및 특수문자 안전 전달)
          printf "%s" "$HARBOR_PASS" | docker login ${{ env.HARBOR_REGISTRY }} -u "$HARBOR_USER" --password-stdin

      # 4-1. API 서비스 빌드 및 푸시
      - name: Build and Push API Service
        run: |
          docker build \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-api:latest \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-api:${{ github.sha }} \
            -f ./services/api/Dockerfile ./services/api
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-api --all-tags

      # 4-2. Web 서비스 빌드 및 푸시
      - name: Build and Push Web Service
        run: |
          docker build \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-web:latest \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-web:${{ github.sha }} \
            -f ./services/web/Dockerfile ./services/web
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-web --all-tags

      # 4-3. Worker 서비스 빌드 및 푸시
      - name: Build and Push Worker Service
        run: |
          docker build \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-worker:latest \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-worker:${{ github.sha }} \
            -f ./services/worker/Dockerfile ./services/worker
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/app-audio-worker --all-tags

      # 5. 쿠버네티스 배포 (Main/Master 브랜치만 실행)
      - name: Deploy to Kubernetes
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          kubectl apply -f deploy.yaml --kubeconfig <(echo "${{ secrets.KUBECONFIG }}")
