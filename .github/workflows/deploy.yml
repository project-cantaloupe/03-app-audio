name: CI/CD Pipeline for app-audio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 소스코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Tailscale VPN 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      # 3. Docker Buildx 기본 설정 (복잡한 옵션 모두 제거)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Harbor Private Registry 로그인 (표준 HTTPS 사용)
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: cntlp-onp-wk-01.tail270b85.ts.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 5-1. API 서비스 빌드 & 푸시
      - name: Build and Push API Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          provenance: false
          tags: |
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-api:latest
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-api:${{ github.sha }}

      # 5-2. Web 서비스 빌드 & 푸시
      - name: Build and Push Web Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/web
          file: ./services/web/Dockerfile
          push: true
          provenance: false
          tags: |
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-web:latest
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-web:${{ github.sha }}

      # 5-3. Worker 서비스 빌드 & 푸시
      - name: Build and Push Worker Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/worker
          file: ./services/worker/Dockerfile
          push: true
          provenance: false
          tags: |
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-worker:latest
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-worker:${{ github.sha }}
