name: CI/CD Pipeline for app-audio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 소스코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Tailscale VPN 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      # 2-1. Harbor 서버 IP 추출
      - name: Resolve Harbor IP
        id: harbor-ip
        run: |
          HARBOR_HOST="cntlp-onp-wk-01.tail270b85.ts.net"
          HARBOR_IP=$(tailscale ip -4 $HARBOR_HOST || getent hosts $HARBOR_HOST | awk '{ print $1 }')
          echo "Resolved Harbor IP: $HARBOR_IP"
          echo "ip=$HARBOR_IP" >> $GITHUB_OUTPUT

      # 3. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host
            extra-hosts=cntlp-onp-wk-01.tail270b85.ts.net:${{ steps.harbor-ip.outputs.ip }}

      # 4. Harbor Private Registry 로그인
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: cntlp-onp-wk-01.tail270b85.ts.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 5-1. API 서비스 빌드 & 푸시
      - name: Build and Push API Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          no-cache: true  # 👈 강제 푸시를 위해 캐시 비활성화
          provenance: false
          tags: |
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-api:latest
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-api:${{ github.sha }}

      # 5-2. Web 서비스 빌드 & 푸시
      - name: Build and Push Web Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/web
          file: ./services/web/Dockerfile
          push: true
          no-cache: true  # 👈 강제 푸시를 위해 캐시 비활성화
          provenance: false
          tags: |
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-web:latest
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-web:${{ github.sha }}

      # 5-3. Worker 서비스 빌드 & 푸시
      - name: Build and Push Worker Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/worker
          file: ./services/worker/Dockerfile
          push: true
          no-cache: true  # 👈 강제 푸시를 위해 캐시 비활성화
          provenance: false
          tags: |
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-worker:latest
            cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-worker:${{ github.sha }}
