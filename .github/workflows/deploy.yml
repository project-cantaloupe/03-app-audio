name: CI/CD Pipeline for app-audio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A deployment must finish in commit order so an older run cannot overwrite a
# newer image tag in the GitOps repository.
concurrency:
  group: app-audio-delivery-main
  cancel-in-progress: false

env:
  HARBOR_REGISTRY: cntlp-onp-wk-01.tail270b85.ts.net
  HARBOR_PROJECT: library
  MANIFESTS_REPOSITORY: project-cantaloupe/02-k8s-manifests

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Test API
        working-directory: services/api
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test and lint worker
        working-directory: services/worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          pytest -q
          ruff check src tests
          ruff format --check src tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: Build web application
        working-directory: services/web
        run: |
          npm ci
          npm run build

      - name: Validate shared schemas and whitespace
        run: |
          python -m json.tool shared/schema/transcode-job.json >/dev/null
          python -m json.tool shared/schema/transcode-result.json >/dev/null
          python -m json.tool shared/schema/scan-result.json >/dev/null
          git diff --check

  publish-and-promote:
    name: Publish images and promote GitOps manifests
    needs: validate
    # Pull requests must never receive registry or cross-repository write
    # credentials. Only a successful main push is promotable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Verify delivery secrets are configured
        env:
          MANIFESTS_TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
        run: |
          if [ -z "$MANIFESTS_TOKEN" ]; then
            echo "MANIFESTS_TOKEN must be configured before publishing images."
            exit 1
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          hostname: github-runner-${{ github.run_id }}

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Build and push API image
        run: |
          set -euo pipefail
          image="$HARBOR_REGISTRY/$HARBOR_PROJECT/app-audio-api:${GITHUB_SHA}"
          docker build --tag "$image" --file services/api/Dockerfile services/api
          docker push "$image"

      - name: Build and push web image
        run: |
          set -euo pipefail
          image="$HARBOR_REGISTRY/$HARBOR_PROJECT/web:${GITHUB_SHA}"
          docker build \
            --build-arg VITE_DEV_SUBJECT="${{ vars.VITE_DEV_SUBJECT }}" \
            --build-arg VITE_AUTH_MODE="${{ vars.VITE_AUTH_MODE || 'development' }}" \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --tag "$image" --file services/web/Dockerfile services/web
          docker push "$image"

      - name: Build and push worker image
        run: |
          set -euo pipefail
          image="$HARBOR_REGISTRY/$HARBOR_PROJECT/worker:${GITHUB_SHA}"
          docker build --tag "$image" --file services/worker/Dockerfile services/worker
          docker push "$image"

      - name: Check out GitOps manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFESTS_REPOSITORY }}
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests
          persist-credentials: true

      - name: Update image tags
        working-directory: manifests
        run: |
          set -euo pipefail
          for file in \
            apps/audio/api/kustomization.yaml \
            apps/audio/web/kustomization.yaml \
            apps/audio/worker/kustomization.yaml; do
            sed -i -E "s#^(    newTag: ).*#\\1${GITHUB_SHA}#" "$file"
          done
          git diff --check

      - name: Create GitOps promotion pull request
        id: promotion
        working-directory: manifests
        env:
          GH_TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
        run: |
          set -euo pipefail
          branch="ci/promote-audio-${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add apps/audio/api/kustomization.yaml \
            apps/audio/web/kustomization.yaml \
            apps/audio/worker/kustomization.yaml
          git commit -m "chore(audio): promote ${GITHUB_SHA}"
          git push --force-with-lease origin "$branch"

          pr_url="$(gh pr list --base main --head "$branch" --state open \
            --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head "$branch" \
              --title "chore(audio): promote ${GITHUB_SHA}" \
              --body "Promotes the Harbor images built from ${GITHUB_SHA}.")"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable automatic merge for GitOps promotion
        if: steps.promotion.outputs.changed == 'true'
        working-directory: manifests
        env:
          GH_TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
        run: gh pr merge "${{ steps.promotion.outputs.pr_url }}" --auto --squash --delete-branch
