name: CI/CD Pipeline for app-audio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  HARBOR_REGISTRY: cntlp-onp-wk-01.tail270b85.ts.net:31432

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 소스코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Tailscale VPN 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      # 2-1. Insecure Registry 설정 (HTTP 허용)
      - name: Set Insecure Registry for Docker
        run: |
          sudo json=$(jq '. + {"insecure-registries": ["${{ env.HARBOR_REGISTRY }}"]}' /etc/docker/daemon.json 2>/dev/null || echo '{"insecure-registries": ["${{ env.HARBOR_REGISTRY }}"]}')
          echo "$json" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # 3. Harbor Private Registry 로그인
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 4-1. API 서비스 빌드 & 푸시
      - name: Build and Push API Service
        run: |
          docker build --no-cache \
            -t ${{ env.HARBOR_REGISTRY }}/library/app-audio-api:latest \
            -t ${{ env.HARBOR_REGISTRY }}/library/app-audio-api:${{ github.sha }} \
            -f ./services/api/Dockerfile ./services/api
          docker push ${{ env.HARBOR_REGISTRY }}/library/app-audio-api:latest
          docker push ${{ env.HARBOR_REGISTRY }}/library/app-audio-api:${{ github.sha }}

      # 4-2. Web 서비스 빌드 & 푸시
      - name: Build and Push Web Service
        run: |
          docker build --no-cache \
            -t ${{ env.HARBOR_REGISTRY }}/library/app-audio-web:latest \
            -t ${{ env.HARBOR_REGISTRY }}/library/app-audio-web:${{ github.sha }} \
            -f ./services/web/Dockerfile ./services/web
          docker push ${{ env.HARBOR_REGISTRY }}/library/app-audio-web:latest
          docker push ${{ env.HARBOR_REGISTRY }}/library/app-audio-web:${{ github.sha }}

      # 4-3. Worker 서비스 빌드 & 푸시
      - name: Build and Push Worker Service
        run: |
          docker build --no-cache \
            -t ${{ env.HARBOR_REGISTRY }}/library/app-audio-worker:latest \
            -t ${{ env.HARBOR_REGISTRY }}/library/app-audio-worker:${{ github.sha }} \
            -f ./services/worker/Dockerfile ./services/worker
          docker push ${{ env.HARBOR_REGISTRY }}/library/app-audio-worker:latest
          docker push ${{ env.HARBOR_REGISTRY }}/library/app-audio-worker:${{ github.sha }}
