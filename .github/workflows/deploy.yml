name: CI/CD Pipeline for app-audio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A deployment must finish in commit order so an older run cannot overwrite a
# newer image tag in the GitOps repository.
concurrency:
  group: app-audio-delivery-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  HARBOR_REGISTRY: cntlp-onp-wk-01.tail270b85.ts.net
  HARBOR_PROJECT: library
  MANIFESTS_REPOSITORY: project-cantaloupe/02-k8s-manifests

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Test API
        working-directory: services/api
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test and lint worker
        working-directory: services/worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          pytest -q
          ruff check src tests
          ruff format --check src tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: Build web application
        working-directory: services/web
        run: |
          npm ci
          npm run build

      - name: Validate shared schemas and whitespace
        run: |
          python -m json.tool shared/schema/transcode-job.json >/dev/null
          python -m json.tool shared/schema/transcode-result.json >/dev/null
          python -m json.tool shared/schema/scan-result.json >/dev/null
          git diff --check

  publish-and-promote:
    name: Publish images and promote GitOps manifests
    needs: validate
    # Pull requests must never receive registry or cross-repository write
    # credentials. Only a successful main push is promotable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Verify delivery secrets are configured
        env:
          MANIFESTS_TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
          AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          if [ -z "$MANIFESTS_TOKEN" ] || [ -z "$AWS_GITHUB_ACTIONS_ROLE_ARN" ]; then
            echo "MANIFESTS_TOKEN and AWS_GITHUB_ACTIONS_ROLE_ARN must be configured before publishing images."
            exit 1
          fi

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          hostname: github-runner-${{ github.run_id }}

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Build and push API image
        run: |
          set -euo pipefail
          harbor_image="$HARBOR_REGISTRY/$HARBOR_PROJECT/app-audio-api:${GITHUB_SHA}"
          docker build --tag "$harbor_image" --file services/api/Dockerfile services/api
          docker push "$harbor_image"

      - name: Build and push web image
        run: |
          set -euo pipefail
          harbor_image="$HARBOR_REGISTRY/$HARBOR_PROJECT/web:${GITHUB_SHA}"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --tag "$harbor_image" --file services/web/Dockerfile services/web
          docker push "$harbor_image"

      - name: Build and push worker image
        run: |
          set -euo pipefail
          harbor_image="$HARBOR_REGISTRY/$HARBOR_PROJECT/worker:${GITHUB_SHA}"
          docker build --tag "$harbor_image" --file services/worker/Dockerfile services/worker
          docker push "$harbor_image"

      # Wait for Trivy scan before promoting
      - name: Promote Harbor images to Amazon ECR
        id: ecr-promotion
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          wait_for_scan() {
            local harbor_repository="$1"
            local url="https://$HARBOR_REGISTRY/api/v2.0/projects/$HARBOR_PROJECT/repositories/$harbor_repository/artifacts/${GITHUB_SHA}?with_scan_overview=true"
            local max_attempts=30
            local attempt=1
            echo "Waiting for Trivy scan on $harbor_repository..."
            
            while [ $attempt -le $max_attempts ]; do
              local res=$(curl -sS -f -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "$url") || { echo "Failed to fetch scan status"; sleep 10; attempt=$((attempt + 1)); continue; }
              local status=$(echo "$res" | jq -r '.scan_overview[]?.scan_status // "Pending"')
              
              if [ "$status" = "Success" ]; then
                echo "Scan finished successfully."
                return 0
              elif [ "$status" = "Error" ]; then
                echo "Scan failed!"
                return 1
              fi
              
              echo "Scan status: $status. Retrying in 10s... ($attempt/$max_attempts)"
              sleep 10
              attempt=$((attempt + 1))
            done
            echo "Timeout waiting for scan."
            return 1
          }

          promote() {
            local harbor_repository="$1"
            local ecr_repository="$2"
            
            wait_for_scan "$harbor_repository"
            
            local harbor_image="$HARBOR_REGISTRY/$HARBOR_PROJECT/$harbor_repository:${GITHUB_SHA}"
            local ecr_image="$ECR_REGISTRY/$ecr_repository:${GITHUB_SHA}"
            docker pull "$harbor_image"
            docker tag "$harbor_image" "$ecr_image"
            docker push "$ecr_image"
          }
          promote app-audio-api app-audio-api
          promote web app-audio-web
          promote worker app-audio-worker

      - name: Notify Slack on Trivy Failure
        if: failure() && steps.ecr-promotion.outcome == 'failure'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "channel": "#trivy-alerts",
              "text": "🚨 *Trivy Scan Failed or Timed Out!*\n*Repository:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Pipeline>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Check out GitOps manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFESTS_REPOSITORY }}
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests
          persist-credentials: true

      - name: Promote AWS deployment images
        working-directory: manifests
        run: |
          set -euo pipefail
          api_file="apps/audio/api/kustomization.yaml"
          web_file="apps/audio/web/kustomization.yaml"
          worker_file="apps/audio/worker/kustomization.yaml"
          sed -i -E "s#^    newName: .*#    newName: 764553891928.dkr.ecr.ap-northeast-2.amazonaws.com/app-audio-api#; s#^(    newTag: ).*#\\1${GITHUB_SHA}#" "$api_file"
          sed -i -E "s#^    newName: .*#    newName: 764553891928.dkr.ecr.ap-northeast-2.amazonaws.com/app-audio-web#; s#^(    newTag: ).*#\\1${GITHUB_SHA}#" "$web_file"
          sed -i -E "s#^    newName: .*#    newName: 764553891928.dkr.ecr.ap-northeast-2.amazonaws.com/app-audio-worker#; s#^(    newTag: ).*#\\1${GITHUB_SHA}#" "$worker_file"
          git diff --check

      - name: Create GitOps promotion pull request
        id: promotion
        working-directory: manifests
        env:
          GH_TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
        run: |
          set -euo pipefail
          branch="ci/promote-audio-${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add apps/audio/api/kustomization.yaml \
            apps/audio/web/kustomization.yaml \
            apps/audio/worker/kustomization.yaml
          git commit -m "chore(audio): promote ${GITHUB_SHA}"
          git push --force-with-lease origin "$branch"

          pr_url="$(gh pr list --base main --head "$branch" --state open \
            --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head "$branch" \
              --title "chore(audio): promote ${GITHUB_SHA}" \
              --body "Promotes the ECR deployment images built from ${GITHUB_SHA}. Harbor images are retained for internal validation.")"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Merge GitOps promotion and notify Argo CD
        if: steps.promotion.outputs.changed == 'true'
        working-directory: manifests
        env:
          GH_TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.promotion.outputs.pr_url }}" --squash --delete-branch

          # The runner is already on the private Tailscale network. Notify
          # Argo CD immediately after the GitOps commit is merged instead of
          # waiting for its periodic repository poll.
          payload="$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg repo "https://github.com/project-cantaloupe/02-k8s-manifests" \
            '{ref: "refs/heads/main", after: $sha, repository: {html_url: $repo, clone_url: ($repo + ".git")}}')"
          curl --fail --silent --show-error \
            --request POST "https://cntlp-onp-wk-01.tail270b85.ts.net/argocd/api/webhook" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data "$payload"
