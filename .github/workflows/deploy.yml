name: CI/CD Pipeline for app-audio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 소스코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Tailscale VPN 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      # 3. Harbor Private Registry 로그인
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: cntlp-onp-wk-01.tail270b85.ts.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 4-1. API 서비스 빌드 & 푸시
      - name: Build and Push API Service
        run: |
          docker build --no-cache -t cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-api:latest -t cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-api:${{ github.sha }} -f ./services/api/Dockerfile ./services/api
          docker push cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-api:latest
          docker push cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-api:${{ github.sha }}

      # 4-2. Web 서비스 빌드 & 푸시
      - name: Build and Push Web Service
        run: |
          docker build --no-cache -t cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-web:latest -t cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-web:${{ github.sha }} -f ./services/web/Dockerfile ./services/web
          docker push cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-web:latest
          docker push cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-web:${{ github.sha }}

      # 4-3. Worker 서비스 빌드 & 푸시
      - name: Build and Push Worker Service
        run: |
          docker build --no-cache -t cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-worker:latest -t cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-worker:${{ github.sha }} -f ./services/worker/Dockerfile ./services/worker
          docker push cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-worker:latest
          docker push cntlp-onp-wk-01.tail270b85.ts.net/library/app-audio-worker:${{ github.sha }}
