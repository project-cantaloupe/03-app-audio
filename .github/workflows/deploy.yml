name: CI/CD Pipeline for app-audio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 소스코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Tailscale VPN 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      # 3. Docker Daemon에 Insecure Registry(HTTP) 등록
      - name: Configure Docker daemon for Insecure Registry
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries": ["100.69.73.122:30080"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # 4. Docker Buildx 설정 (Tailscale 네트워크 공유를 위한 host 모드 설정)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host
          buildkitd-flags: --allow-insecure-entitlement security.insecure
          config-inline: |
            [registry."100.69.73.122:30080"]
              http = true
              insecure = true

      # 5. Harbor Private Registry 로그인
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: 100.69.73.122:30080
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 6-1. API 서비스 빌드 & 푸시
      - name: Build and Push API Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          provenance: false
          tags: |
            100.69.73.122:30080/library/app-audio-api:latest
            100.69.73.122:30080/library/app-audio-api:${{ github.sha }}

      # 6-2. Web 서비스 빌드 & 푸시
      - name: Build and Push Web Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/web
          file: ./services/web/Dockerfile
          push: true
          provenance: false
          tags: |
            100.69.73.122:30080/library/app-audio-web:latest
            100.69.73.122:30080/library/app-audio-web:${{ github.sha }}

      # 6-3. Worker 서비스 빌드 & 푸시
      - name: Build and Push Worker Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/worker
          file: ./services/worker/Dockerfile
          push: true
          provenance: false
          tags: |
            100.69.73.122:30080/library/app-audio-worker:latest
            100.69.73.122:30080/library/app-audio-worker:${{ github.sha }}
